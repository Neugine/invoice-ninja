# Railway Config-as-Code
# This file defines the services and their configuration

[[services]]
name = "invoice-ninja"
source = "."

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[services.deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables for Invoice Ninja
[[services.env]]
name = "APP_ENV"
value = "production"

[[services.env]]
name = "APP_DEBUG"
value = "false"

[[services.env]]
name = "APP_URL"
# This will be set to your Railway domain automatically
value = "${{ RAILWAY_PUBLIC_DOMAIN }}"

[[services.env]]
name = "APP_KEY"
# Generate this with: docker run --rm invoiceninja/invoiceninja php artisan key:generate --show
# Or set it manually in Railway dashboard
value = "base64:YOUR_APP_KEY_HERE_CHANGE_THIS"

[[services.env]]
name = "APP_CIPHER"
value = "AES-256-CBC"

[[services.env]]
name = "DB_CONNECTION"
value = "mysql"

[[services.env]]
name = "DB_HOST"
value = "${{ MySQL.RAILWAY_PRIVATE_DOMAIN }}"

[[services.env]]
name = "DB_PORT"
value = "${{ MySQL.PORT }}"

[[services.env]]
name = "DB_DATABASE"
value = "${{ MySQL.MYSQLDATABASE }}"

[[services.env]]
name = "DB_USERNAME"
value = "${{ MySQL.MYSQLUSER }}"

[[services.env]]
name = "DB_PASSWORD"
value = "${{ MySQL.MYSQLPASSWORD }}"

[[services.env]]
name = "DB_STRICT"
value = "false"

[[services.env]]
name = "REQUIRE_HTTPS"
value = "true"
